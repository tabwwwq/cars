name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Luau tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Luau runner
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/luau-runner/target
          key: luaurun-${{ runner.os }}-${{ hashFiles('tools/luau-runner/Cargo.lock', 'tools/luau-runner/src/**') }}

      - name: Run tests (car builder, physics, server, client)
        run: tools/test.sh

      - name: Check Roblox API usage (classes, properties, methods, enums)
        run: |
          curl -sSfL https://raw.githubusercontent.com/MaximumADHD/Roblox-Client-Tracker/roblox/Full-API-Dump.json -o "$RUNNER_TEMP/api.json"
          python3 tools/check_api.py "$RUNNER_TEMP/api.json" src
